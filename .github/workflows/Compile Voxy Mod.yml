name: Compile Voxy Mod

on:
  workflow_dispatch: # Permet de lancer la compilation manuellement en un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe Java 25 (requis pour Minecraft 26.3)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 3. Configure Gradle et met en cache les dépendances pour aller plus vite
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Donne les permissions d'exécution au script de build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Compile le fichier .jar du mod
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Récupère le fichier .jar généré pour pouvoir le télécharger
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxy-26.3-JAR
          path: build/libs/*.jar
